<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research Assistant — Live Session</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #202124;
      width: 100vw; height: 100vh;
      overflow: hidden;
      color: white;
    }

    /* ── Video call — full height ── */
    .call-area {
      position: fixed;
      top: 0; bottom: 64px; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #202124;
      container-type: size;
    }

    .main-tile {
      width: min(94cqw, calc(82cqh * 16 / 9), 1100px);
      aspect-ratio: 16/9;
      background: #2c2e33;
      border-radius: 14px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 32px rgba(0,0,0,0.4);
    }

    .tile-bg {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse at 35% 40%, rgba(80,90,120,0.25) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 65%, rgba(60,70,100,0.2) 0%, transparent 50%),
        linear-gradient(160deg, #2a2d35 0%, #1e2028 100%);
    }

    .p-avatar {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 82px; height: 82px;
      border-radius: 50%;
      background: linear-gradient(145deg, #4a6572, #37474f);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; font-weight: 600;
      color: rgba(255,255,255,0.9);
      box-shadow: 0 2px 16px rgba(0,0,0,0.3);
      transition: box-shadow 0.3s ease;
    }

    /* Speaking ring */
    .p-avatar.speaking {
      box-shadow: 0 0 0 3px rgba(124,152,133,0.5), 0 0 0 7px rgba(124,152,133,0.15), 0 2px 16px rgba(0,0,0,0.3);
    }

    .p-name {
      position: absolute;
      top: 14px; left: 16px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(8px);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.88);
    }

    /* ── Live captions ── */
    .captions {
      position: absolute;
      bottom: 24px; left: 50%;
      transform: translateX(-50%);
      width: min(78%, 700px);
      text-align: center;
      pointer-events: none;
    }

    .caption-who {
      font-size: 0.65rem;
      font-weight: 600;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 4px;
    }

    .caption-line {
      display: inline-block;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(10px);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 0.875rem;
      color: rgba(255,255,255,0.92);
      line-height: 1.5;
      min-height: 32px;
    }

    .c-cursor {
      display: inline-block;
      width: 2px; height: 0.82em;
      background: rgba(255,255,255,0.55);
      margin-left: 2px;
      vertical-align: middle;
      animation: blink 0.75s step-end infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    /* Self-view */
    .self-tile {
      position: fixed;
      bottom: 76px; right: 16px;
      width: 160px;
      aspect-ratio: 16/9;
      background: #2a2d35;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.06);
    }

    .self-av {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: 34px; height: 34px;
      border-radius: 50%;
      background: linear-gradient(145deg, #5a6d62, #4a5c52);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem; font-weight: 600;
      color: rgba(255,255,255,0.9);
    }

    .self-lbl {
      position: absolute;
      bottom: 5px; left: 7px;
      font-size: 0.65rem;
      color: rgba(255,255,255,0.6);
    }

    /* ── Controls ── */
    .controls {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 64px;
      background: #1a1c1f;
      border-top: 1px solid rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 100;
    }

    .ctrl-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.8);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s ease;
    }

    .ctrl-btn:hover { background: rgba(255,255,255,0.14); }

    .ctrl-btn.end {
      background: #ea4335;
      width: 48px; height: 48px;
      font-size: 1rem;
    }

    .ctrl-btn.end:hover { background: #d33426; }

    /* ── Floating question widget ── */
    .q-widget {
      position: fixed;
      top: 16px; left: 16px;
      width: 340px;
      background: rgba(8,8,8,0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      z-index: 200;
      overflow: visible;
      min-width: 220px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.55), 0 0 0 0.5px rgba(255,255,255,0.04);
      user-select: none;
    }

    /* Drag handle */
    .q-handle {
      height: 32px;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px 12px 0 0;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      cursor: grab;
    }

    .q-handle:active { cursor: grabbing; }

    .q-grip {
      flex: 1;
      color: rgba(255,255,255,0.18);
      font-size: 0.68rem;
      letter-spacing: 3px;
    }

    .q-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #7c9885;
      flex-shrink: 0;
      animation: breathe 2.2s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.3; transform: scale(0.7); }
    }

    .q-status { font-size: 0.68rem; color: rgba(124,152,133,0.7); white-space: nowrap; }
    .q-t      { font-size: 0.68rem; color: rgba(255,255,255,0.22); font-variant-numeric: tabular-nums; }

    /* Body */
    .q-body { padding: 12px 14px 8px; overflow: hidden; }

    .q-num {
      font-size: 0.65rem;
      font-weight: 600;
      color: #7c9885;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 5px;
    }

    .q-text {
      font-size: 0.88rem;
      color: rgba(255,255,255,0.9);
      line-height: 1.5;
      transition: opacity 0.2s ease;
    }

    .q-text.fade { opacity: 0; }

    /* AI note */
    .q-ai-note {
      margin-top: 8px;
      font-size: 0.74rem;
      color: rgba(124,152,133,0.75);
      line-height: 1.4;
      padding: 5px 8px;
      background: rgba(124,152,133,0.07);
      border-left: 2px solid rgba(124,152,133,0.3);
      border-radius: 0 4px 4px 0;
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.35s ease, opacity 0.3s ease;
    }

    .q-ai-note.show { max-height: 52px; opacity: 1; }

    /* Footer */
    .q-foot {
      padding: 6px 12px 12px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .q-next {
      font-size: 0.74rem;
      color: rgba(255,255,255,0.45);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 5px;
      padding: 4px 10px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
    }

    .q-next:hover {
      background: rgba(124,152,133,0.15);
      border-color: rgba(124,152,133,0.3);
      color: rgba(124,152,133,0.9);
    }

    /* Resize handle */
    .q-resize-handle {
      position: absolute;
      bottom: -1px; right: -1px;
      width: 18px; height: 18px;
      cursor: se-resize;
      z-index: 201;
    }

    .q-resize-handle::after {
      content: '';
      position: absolute;
      bottom: 5px; right: 5px;
      width: 7px; height: 7px;
      border-right: 1.5px solid rgba(255,255,255,0.2);
      border-bottom: 1.5px solid rgba(255,255,255,0.2);
      border-radius: 0 0 2px 0;
    }

    /* ── Probe card ── */
    .probe-card {
      position: fixed;
      top: 16px; right: 16px;
      width: 290px;
      background: white;
      border-radius: 10px;
      border-left: 3px solid #7c9885;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      padding: 0.875rem 1rem;
      z-index: 200;
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .probe-card.visible { opacity: 1; transform: translateY(0); pointer-events: all; }

    .probe-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }

    .probe-lbl { font-size: 0.7rem; font-weight: 600; color: #7c9885; text-transform: uppercase; letter-spacing: 0.08em; }

    .probe-x {
      width: 18px; height: 18px; border-radius: 50%;
      border: none; background: #f0f0f0; color: #888;
      font-size: 0.65rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-family: inherit; transition: background 0.15s ease;
    }

    .probe-x:hover { background: #e0e0e0; color: #444; }

    .probe-txt { font-size: 0.875rem; color: #2a2a2a; line-height: 1.5; }

    /* ── Insight toast ── */
    .insight-toast {
      position: fixed;
      top: 16px; right: 16px;
      width: 290px;
      background: #fffbee;
      border: 1px solid #f0dc98;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      padding: 0.75rem 1rem;
      z-index: 200;
      display: flex; align-items: flex-start; gap: 0.5rem;
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .insight-toast.visible { opacity: 1; transform: translateY(0); }

    .t-icon { font-size: 1rem; flex-shrink: 0; line-height: 1.4; }
    .t-body { display: flex; flex-direction: column; gap: 0.15rem; }
    .t-lbl  { font-size: 0.7rem; font-weight: 600; color: #b08a20; text-transform: uppercase; letter-spacing: 0.08em; }
    .t-msg  { font-size: 0.82rem; color: #6b5010; line-height: 1.4; }

    /* ── End overlay ── */
    .end-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.82);
      backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center;
      z-index: 300;
      opacity: 0; pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .end-overlay.visible { opacity: 1; pointer-events: all; }

    .end-card {
      background: white;
      border-radius: 16px;
      padding: 2.5rem 3rem;
      text-align: center;
      max-width: 400px; width: 90%;
      transform: translateY(10px);
      transition: transform 0.35s ease;
    }

    .end-overlay.visible .end-card { transform: translateY(0); }

    .end-ico {
      width: 56px; height: 56px; border-radius: 50%;
      background: #f0f4f1;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; margin: 0 auto 1.25rem;
    }

    .end-h  { font-size: 1.25rem; font-weight: 500; color: #1a1a1a; margin-bottom: 0.5rem; }
    .end-s  { font-size: 0.9rem; color: #6b6b6b; margin-bottom: 1.75rem; line-height: 1.5; }

    .end-stats {
      display: flex; justify-content: center; gap: 2rem;
      margin-bottom: 1.75rem;
      padding: 1rem 0;
      border-top: 1px solid #f0f0f0;
      border-bottom: 1px solid #f0f0f0;
    }

    .e-val { font-size: 1.4rem; font-weight: 300; color: #1a1a1a; letter-spacing: -0.02em; }
    .e-lbl { font-size: 0.72rem; color: #9a9a9a; }

    .btn-ins {
      display: block; width: 100%;
      padding: 0.875rem;
      font-size: 0.9rem; font-weight: 500;
      color: white; background: #6b7f73;
      border: none; border-radius: 8px;
      cursor: pointer; font-family: inherit;
      transition: all 0.2s ease;
    }

    .btn-ins:hover { background: #5a6d62; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(107,127,115,0.25); }
  </style>
</head>
<body>

  <!-- Video call -->
  <div class="call-area">
    <div class="main-tile">
      <div class="tile-bg"></div>
      <div class="p-avatar" id="pAvatar">SC</div>
      <div class="p-name">Sarah Chen — Participant</div>
      <div class="captions">
        <div class="caption-who">Sarah Chen</div>
        <div class="caption-line" id="captionEl"><span class="c-cursor"></span></div>
      </div>
    </div>
  </div>

  <!-- Self-view -->
  <div class="self-tile">
    <div class="self-av">You</div>
    <span class="self-lbl">You</span>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="ctrl-btn">🎙</button>
    <button class="ctrl-btn">📷</button>
    <button class="ctrl-btn">🖥</button>
    <button class="ctrl-btn end" id="endBtn">📵</button>
  </div>

  <!-- Floating question widget -->
  <div class="q-widget" id="qWidget">
    <div class="q-handle" id="qHandle">
      <span class="q-grip">· · · · ·</span>
      <div class="q-dot"></div>
      <span class="q-status">AI noting…</span>
      <span class="q-t" id="qTimer">00:00</span>
    </div>
    <div class="q-body">
      <div class="q-num" id="qNum">Q1/6</div>
      <div class="q-text" id="qText"></div>
      <div class="q-ai-note" id="qAiNote"></div>
    </div>
    <div class="q-foot">
      <button class="q-next" id="qNext">Next question →</button>
    </div>
    <div class="q-resize-handle" id="qResize"></div>
  </div>

  <!-- Probe card -->
  <div class="probe-card" id="probeCard">
    <div class="probe-header">
      <span class="probe-lbl">💡 Consider probing</span>
      <button class="probe-x" id="probeX">✕</button>
    </div>
    <div class="probe-txt" id="probeTxt"></div>
  </div>

  <!-- Insight toast -->
  <div class="insight-toast" id="insightToast">
    <span class="t-icon">🔍</span>
    <div class="t-body">
      <span class="t-lbl">Insight captured · nice one</span>
      <span class="t-msg" id="toastMsg"></span>
    </div>
  </div>

  <!-- End overlay -->
  <div class="end-overlay" id="endOverlay">
    <div class="end-card">
      <div class="end-ico">✓</div>
      <div class="end-h">Session complete</div>
      <div class="end-s">Good work. AI captured notes and flagged insights throughout.</div>
      <div class="end-stats">
        <div><div class="e-val" id="eI">0</div><div class="e-lbl">Insights</div></div>
        <div><div class="e-val" id="eQ">0/6</div><div class="e-lbl">Questions</div></div>
        <div><div class="e-val" id="eT">—</div><div class="e-lbl">Duration</div></div>
      </div>
      <button class="btn-ins" onclick="window.location.href='insights.html'">View Insight Doc →</button>
    </div>
  </div>

  <script>
    const DATA = [
      {
        q: "Can you walk me through how you currently manage your research projects?",
        probe: "What does that look like on a hectic week?",
        note: "Ad-hoc system — Notion + folders, no dedicated tool",
        insight: null,
        captions: [
          "So I keep everything in Notion mostly...",
          "but I also have sticky notes all over my desk.",
          "It gets pretty fragmented to be honest.",
          "I've never found one tool that does it all.",
        ]
      },
      {
        q: "What tools do you use to keep track of participant notes during sessions?",
        probe: "Have you tried anything that didn't work out?",
        note: "Google Docs + sticky notes — finds it fragmented",
        insight: "Tool fragmentation — juggling 3+ apps in a single session",
        captions: [
          "I've tried Otter.ai, Google Docs, a notes app...",
          "None of them really work the way I need.",
          "I usually end up with three things open at once.",
          "It's messy. And hard to find things afterwards.",
        ]
      },
      {
        q: "Tell me about the last time a research session felt overwhelming. What happened?",
        probe: "What would have made that easier?",
        note: "Solo session, 3 tasks — lost track of probes mid-task",
        insight: "Cognitive overload peaks when managing script and notes simultaneously",
        captions: [
          "There was this one session last month...",
          "Three tasks, I was alone, no second researcher.",
          "I just started to lose the thread completely.",
          "Couldn't track the script and take notes at the same time.",
        ]
      },
      {
        q: "What does your note-taking process look like in the moment — during a live session?",
        probe: "Do you ever feel like you miss things while noting?",
        note: "Types fast, misses non-verbal cues — describes it as 'catch-up mode'",
        insight: "Note-taking competes directly with active listening",
        captions: [
          "I type fast, but I'm in catch-up mode the whole time.",
          "You miss things — like the facial expression when",
          "someone says 'yeah that makes sense' but clearly it doesn't.",
          "That non-verbal stuff is gold and it just slips through.",
        ]
      },
      {
        q: "If you could change one thing about your current research workflow, what would it be?",
        probe: "Why that specifically, over everything else?",
        note: "Wants automated note-taking — tried Otter.ai but too generic for UX",
        insight: null,
        captions: [
          "Honestly? Automated note-taking.",
          "Something that just... runs in the background.",
          "I looked at Otter.ai but it's too generic for UX work.",
          "It doesn't know what a good research insight looks like.",
        ]
      },
      {
        q: "Is there anything else about your research process you'd like to share?",
        probe: "Any tool or approach you wish existed?",
        note: "Wants 'quiet co-pilot' — present but not intrusive",
        insight: "Researchers want a \"quiet co-pilot\" — help without interruption",
        captions: [
          "What I'd really want is something quiet.",
          "Like a stage manager — present, tracking everything,",
          "but not interrupting me or the participant.",
          "Just helping me catch what I'd otherwise miss.",
        ]
      }
    ];

    let idx = 0, secs = 0, insightCount = 0;
    let probeTimer, insightTimer, autoDismiss;

    const qNum   = document.getElementById('qNum');
    const qText  = document.getElementById('qText');
    const qNote  = document.getElementById('qAiNote');
    const qTimer = document.getElementById('qTimer');
    const qNext  = document.getElementById('qNext');
    const probe  = document.getElementById('probeCard');
    const probeTxt = document.getElementById('probeTxt');
    const toast  = document.getElementById('insightToast');
    const toastMsg = document.getElementById('toastMsg');
    const endOv  = document.getElementById('endOverlay');
    const capEl  = document.getElementById('captionEl');
    const avatar = document.getElementById('pAvatar');

    // ── Timer ──
    setInterval(() => {
      secs++;
      qTimer.textContent = pad(Math.floor(secs/60)) + ':' + pad(secs%60);
    }, 1000);
    function pad(n) { return String(n).padStart(2,'0'); }

    // ── Captions engine ──
    let capQ = [], capI = 0, charI = 0, capIv, capPause;

    function startCaptions(lines) {
      stopCaptions();
      capQ = lines; capI = 0; charI = 0;
      capEl.innerHTML = '<span class="c-cursor"></span>';
      scheduleLine();
    }

    function stopCaptions() {
      clearInterval(capIv); clearTimeout(capPause);
      avatar.classList.remove('speaking');
    }

    function scheduleLine() {
      if (capI >= capQ.length) {
        avatar.classList.remove('speaking');
        capPause = setTimeout(() => { capI = 0; charI = 0; capEl.innerHTML = '<span class="c-cursor"></span>'; capPause = setTimeout(scheduleLine, 1500); }, 2800);
        return;
      }
      const line = capQ[capI];
      charI = 0;
      avatar.classList.add('speaking');
      capEl.innerHTML = '<span class="c-cursor"></span>';
      capIv = setInterval(() => {
        if (charI <= line.length) {
          capEl.innerHTML = line.slice(0, charI) + '<span class="c-cursor"></span>';
          charI++;
        } else {
          clearInterval(capIv);
          capI++;
          capPause = setTimeout(scheduleLine, 1600);
        }
      }, 36);
    }

    // ── Render question ──
    function render(i) {
      const d = DATA[i];
      clearTimeout(probeTimer); clearTimeout(insightTimer); clearTimeout(autoDismiss);
      probe.classList.remove('visible');
      toast.classList.remove('visible');

      qText.classList.add('fade');
      qNote.classList.remove('show');

      setTimeout(() => {
        qNum.textContent = `Q${i+1}/${DATA.length}`;
        qText.textContent = d.q;
        qText.classList.remove('fade');
        qNext.textContent = i === DATA.length-1 ? 'Finish session' : 'Next question →';
      }, 200);

      setTimeout(() => startCaptions(d.captions), 350);

      setTimeout(() => {
        qNote.textContent = '📝 ' + d.note;
        qNote.classList.add('show');
      }, 3200);

      probeTimer = setTimeout(() => {
        probeTxt.textContent = d.probe;
        probe.classList.add('visible');
        autoDismiss = setTimeout(() => {
          probe.classList.remove('visible');
          if (d.insight) setTimeout(() => showInsight(d.insight), 600);
        }, 8000);
      }, 7000);

      if (d.insight) {
        insightTimer = setTimeout(() => {
          if (!probe.classList.contains('visible')) showInsight(d.insight);
        }, 16000);
      }
    }

    function showInsight(txt) {
      insightCount++;
      toastMsg.textContent = txt;
      toast.classList.add('visible');
      setTimeout(() => toast.classList.remove('visible'), 5000);
    }

    document.getElementById('probeX').addEventListener('click', () => {
      clearTimeout(autoDismiss);
      probe.classList.remove('visible');
      const d = DATA[idx];
      if (d.insight) setTimeout(() => showInsight(d.insight), 600);
    });

    qNext.addEventListener('click', () => {
      if (idx < DATA.length-1) { idx++; render(idx); } else endSession();
    });

    document.getElementById('endBtn').addEventListener('click', endSession);

    function endSession() {
      clearTimeout(probeTimer); clearTimeout(insightTimer); clearTimeout(autoDismiss);
      stopCaptions();
      document.getElementById('eI').textContent = insightCount;
      document.getElementById('eQ').textContent = `${idx+1}/${DATA.length}`;
      document.getElementById('eT').textContent = pad(Math.floor(secs/60)) + ':' + pad(secs%60);
      endOv.classList.add('visible');
    }

    // ── Draggable + resizable widget ──
    const widget = document.getElementById('qWidget');
    const handle = document.getElementById('qHandle');
    const resizeH = document.getElementById('qResize');
    let drag = null, rsz = null;

    handle.addEventListener('mousedown', e => {
      e.preventDefault();
      drag = { sx: e.clientX, sy: e.clientY, ox: widget.offsetLeft, oy: widget.offsetTop };
    });

    resizeH.addEventListener('mousedown', e => {
      e.preventDefault(); e.stopPropagation();
      rsz = { sx: e.clientX, ow: widget.offsetWidth };
    });

    document.addEventListener('mousemove', e => {
      if (drag) {
        const nx = Math.max(0, Math.min(drag.ox + e.clientX - drag.sx, window.innerWidth  - widget.offsetWidth));
        const ny = Math.max(0, Math.min(drag.oy + e.clientY - drag.sy, window.innerHeight - 80));
        widget.style.left = nx + 'px';
        widget.style.top  = ny + 'px';
      }
      if (rsz) {
        widget.style.width = Math.max(220, Math.min(rsz.ow + e.clientX - rsz.sx, 580)) + 'px';
      }
    });

    document.addEventListener('mouseup', () => { drag = null; rsz = null; });

    render(0);
  </script>
</body>
</html>
